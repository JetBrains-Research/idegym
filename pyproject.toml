[project]
name = "idegym"
version = "0.0.0.dev0"
readme = "README.md"
authors = [
    { name = "Daniil Mironov", email = "daniil.mironov@jetbrains.com" },
    { name = "Ozren Dabić", email = "ozren.dabic@jetbrains.com" },
    { name = "Valentin Fondaratov", email = "valentin.fondaratov@jetbrains.com" },
    { name = "Vladimir Poliakov", email = "vladimir.poliakov@jetbrains.com" },
    { name = "Vseslav Kasatskii", email = "vseslav.kasatskii@jetbrains.com" },
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "from-root>=1.3.0",
    "jinja2>=3.1.6",
    "kubernetes-asyncio>=36.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "testcontainers[postgres]>=4.14.2",
    "pytest-randomly>=4.1.0",
    "python-dotenv>=1.2.2",
    "python-on-whales>=0.81.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "ruff>=0.16.0",
    "supervisor>=4.3.0",
    "tqdm>=4.69.1",
    "tomlkit>=0.15.1",
]

[tool.uv]
required-version = ">=0.10.0"

[tool.uv.sources]
idegym-api = { workspace = true }
idegym-backend-utils = { workspace = true }
idegym-client = { workspace = true }
idegym-common-utils = { workspace = true }
idegym-image-builder = { workspace = true }
idegym-orchestrator = { workspace = true }
idegym-plugins = { workspace = true }
idegym-rewards = { workspace = true }
idegym-server = { workspace = true }
idegym-tools = { workspace = true }
idegym-watcher = { workspace = true }

[tool.uv.workspace]
members = [
    "api",
    "backend-utils",
    "client",
    "common-utils",
    "image-builder",
    "orchestrator",
    "plugins",
    "rewards",
    "server",
    "tools",
    "watcher",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = [
    ".",
    "e2e-tests",
    "integration-tests",
    "unit-tests",
]
testpaths = [
    "e2e-tests",
    "integration-tests",
    "unit-tests",
]
addopts = [
    "--import-mode=importlib",
]
norecursedirs = [
    "e2e-tests/test_projects",
    ".git",
    ".venv",
    "__pycache__",
    "node_modules",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: marks end-to-end test suite",
    "integration: marks integration test suite",
    "unit: marks unit test suite",
    "docker: marks tests that should be run inside a Docker container",
    "ide_integrations: marks tests that build and run a full IDE image (5-10 min); run in CI via the 'idea'/'pycharm' e2e groups (or locally with -m 'e2e and ide_integrations')",
    "idea: e2e group — IntelliJ IDEA image tests (auto-applied by conftest to test_idea*)",
    "pycharm: e2e group — PyCharm image tests (auto-applied by conftest to test_pycharm*)",
    "openhands: e2e group — OpenHands tools plugin tests (auto-applied by conftest to test_openhands*)",
    "kaniko: e2e group — in-cluster image build tests (auto-applied to test_kaniko_build/test_python_api_build)",
    "mcp: e2e group — MCP gateway/proxy tests (auto-applied to test_mcp_plugin/test_orchestrator_mcp/test_server_mcp_proxy)",
]

[tool.ruff]
indent-width = 4
line-length = 120
target-version = "py312"
exclude = [
    "e2e-tests/test_projects/"
]

[tool.ruff.lint]
fixable = ["ALL"]
extend-select = ["I"]
# UP045 would rewrite Optional[X] -> X | None; keep the project's Optional[X] convention.
# UP040 would turn `X: TypeAlias = ...` into `type X = ...`, but several of these aliases
# (e.g. Duration) are instantiated at runtime, and a `type` statement is not callable.
# PYI041 collapses `int | float` to `float`; keep `int` explicit in the documented numeric
# APIs (e.g. CpuQuantity) so signatures match the accepted inputs and the Pydantic schema.
ignore = ["UP045", "UP040", "PYI041"]

[tool.ruff.lint.flake8-bugbear]
# Idiomatic/immutable callables that are safe as argument defaults (suppresses B008):
# FastAPI dependency injection and the project's immutable Pydantic config objects.
extend-immutable-calls = [
    "fastapi.Depends",
    "idegym.api.config.LoggingConfig",
    "idegym.client.operations.utils.PollingConfig",
]

[tool.ruff.lint.per-file-ignores]
# Test suites legitimately do things the linter flags: broad excepts and try/except/pass
# in fixtures/cleanup, pytest.raises(Exception), self-comparisons that exercise __eq__,
# blocking calls inside async test helpers, and hyphenated package dirs.
"*-tests/**" = [
    "BLE001",   # broad except in test helpers/fixtures
    "B017",     # pytest.raises(Exception)
    "S110",     # try/except/pass in teardown
    "PLR0124",  # intentional self-comparison (exercises __eq__)
    "ASYNC221", # subprocess launched from async test helpers
    "ASYNC230", # open() inside async tests
    "ASYNC251", # time.sleep inside an async test
    "G201",     # logger.error(..., exc_info=True) in test logging
    "TRY002",   # raise Exception(...) in tests
    "TRY004",   # non-TypeError raised in test assertions
    "DTZ901",   # datetime.min sentinel in test helpers
    "PLW1510",  # subprocess.run without check= in tests
    "RUF012",   # mutable default on a test fixture class
    "RUF013",   # implicit Optional on a test fixture signature
    "SIM115",   # short-lived file handle in a test
    "UP047",    # PEP 695 generics not required in test helpers
    "N999",     # hyphenated test package names (e2e-tests, unit-tests, integration-tests)
]
# examples/ is illustrative reference code, not production-hardened.
"examples/**" = [
    "BLE001",   # broad except in example agent loops
    "S110",     # try/except/pass in examples
    "DTZ005",   # naive datetime.now() in examples
    "DTZ006",   # naive datetime.fromtimestamp() in examples
    "DTZ007",   # naive strptime() in examples
    "ASYNC230", # open() inside async example code
    "PLW1508",  # os.getenv default typing in examples
    "TRY002",   # raise Exception(...) in examples
    "TRY004",   # non-TypeError in examples
    "EXE002",   # example modules carry a stray executable bit
]
# One-off operational scripts.
"scripts/**" = [
    "BLE001",   # broad except around subprocess/IO in scripts
    "SIM115",   # short-lived file handle in a script
]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false
