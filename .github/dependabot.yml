version: 2

# Policy:
# - Security updates are alert-driven, grouped by SemVer risk, and are not
#   delayed by this schedule.
# - Routine minor/patch version updates run quarterly.
# - Routine major version updates are ignored and must be initiated manually.
# - The /website (npm) presentation site is security-only: routine version
#   updates are disabled (open-pull-requests-limit: 0); security updates still flow.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-major:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "major"
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "[ci] "
    labels:
      - "dependencies"

  # NOTE: the server base images (debian/ubuntu) are built from a Jinja template
  # (Dockerfile.jinja / server.Dockerfile.jinja); their tags live in
  # scripts/build_server_images.py and CANNOT be tracked by Dependabot. Bump them
  # manually. The uv helper image is covered here via the concrete /orchestrator
  # and /watcher Dockerfiles.
  - package-ecosystem: "docker"
    directories:
      - "/orchestrator"
      - "/watcher"
    schedule:
      interval: "quarterly"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-major:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "major"
      # group-by: dependency-name consolidates the same image (e.g. python) across
      # BOTH /orchestrator and /watcher into a single cross-directory PR, instead of
      # one grouped PR per directory. Dropping update-types also catches updates that
      # Dependabot cannot classify (e.g. prerelease tags like 3.15.0bN, which is why
      # #235 fell out of the group). NOTE: this yields at most one PR per distinct
      # image (python, uv) - Dependabot cannot merge different images into one PR.
      docker-routine:
        applies-to: "version-updates"
        patterns:
          - "*"
        group-by: "dependency-name"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "[docker] "
    labels:
      - "dependencies"

  - package-ecosystem: "helm"
    directory: "/charts/idegym"
    schedule:
      interval: "quarterly"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-major:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "major"
      observability-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "grafana"
          - "prometheus"
          - "tempo"
        update-types:
          - "minor"
          - "patch"
      data-services-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "postgresql"
        update-types:
          - "minor"
          - "patch"
      helm-other-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "[helm] "
    labels:
      - "dependencies"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "quarterly"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-major:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "major"
      python-web-stack-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "fastapi*"
          - "starlette"
          - "uvicorn"
          - "anyio"
          - "pydantic*"
          - "python-multipart"
          - "aiohttp"
        update-types:
          - "minor"
          - "patch"
      python-database-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "sqlalchemy"
          - "alembic"
          - "greenlet"
          - "asyncpg"
          - "psycopg*"
        update-types:
          - "minor"
          - "patch"
      python-auth-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "cryptography"
          - "joserfc"
          - "pyjwt"
        update-types:
          - "minor"
          - "patch"
      python-observability-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "opentelemetry-*"
          - "structlog"
        update-types:
          - "minor"
          - "patch"
      python-testing-tooling-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "pytest*"
          - "testcontainers*"
          - "junitparser"
          - "ruff"
          - "pre-commit"
        update-types:
          - "minor"
          - "patch"
      python-platform-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "kubernetes"
          - "kubernetes-asyncio"
          - "python-on-whales"
        update-types:
          - "minor"
          - "patch"
      python-other-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "[dependencies] "
    labels:
      - "dependencies"

  # /examples has its own uv.lock and has received separate security PRs.
  - package-ecosystem: "uv"
    directory: "/examples"
    schedule:
      interval: "quarterly"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    # increase-if-necessary avoids raising lower bounds (e.g. >=1.36 -> >=1.44) when the
    # existing constraint already permits the latest version, while still refreshing the
    # locked version. NOTE: the uv ecosystem does not yet honor versioning-strategy
    # (dependabot-core#12162); this is a no-op until that support lands, at which point
    # it takes effect automatically.
    versioning-strategy: "increase-if-necessary"
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-major:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "major"
      # No update-types filter: this catches minor/patch updates AND updates that
      # Dependabot cannot classify (the OpenTelemetry bumps in #240-#242 carried no
      # update-type), folding them all into a single quarterly PR. The semver-major
      # ignore below still blocks classified majors (an unclassifiable major could
      # slip through - an accepted tradeoff of dropping the filter).
      examples-routine:
        applies-to: "version-updates"
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "[examples] "
    labels:
      - "dependencies"

  # /website is the Docusaurus presentation site (its own package-lock.json). There
  # is no requirement for routine npm version bumps here, so this block is
  # security-only: open-pull-requests-limit: 0 disables routine version updates
  # while leaving Dependabot's alert-driven security updates untouched (security
  # updates have a separate internal limit of 10 and ignore this setting). The two
  # security groups mirror every other ecosystem so npm security PRs are grouped by
  # SemVer risk (security-minor-patch vs security-major) instead of arriving as one
  # ungrouped PR per package (which is why #249/#250 landed separately before this).
  # No `ignore` block is needed: with version updates off, only security updates
  # remain, and security majors must still surface (grouped) for manual review.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "quarterly"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 0
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-major:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "major"
    commit-message:
      prefix: "[website] "
    labels:
      - "dependencies"
