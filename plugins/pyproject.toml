[project]
name = "idegym-plugins"
version = "0.0.0.dev0"
description = "IdeGYM Plugins (defaults, IntelliJ IDEA, PyCharm, shared utilities)"
authors = [
    { name = "Ozren Dabić", email = "ozren.dabic@jetbrains.com" },
    { name = "Vladimir Poliakov", email = "vladimir.poliakov@jetbrains.com" },
    { name = "Vseslav Kasatskii", email = "vseslav.kasatskii@jetbrains.com" },
    { name = "Daniil Mironov", email = "daniil.mironov@jetbrains.com" },
]
requires-python = ">=3.12"
dependencies = [
    "idegym-api",
    "pydantic>=2.10.6",
]

[project.optional-dependencies]
idea = [
    "jinja2>=3.1.5",
]
pycharm = [
    "jinja2>=3.1.5",
]
# NOTE: no `openhands` extra, and OpenHands is deliberately absent from the workspace lock.
# `openhands-sdk` transitively pins `opentelemetry-api==1.39.1` (via `lmnr`), which conflicts with
# `idegym-backend-utils` (`opentelemetry-api>=1.43.0`) — the two cannot share one environment.
# The OpenHands Tools Service therefore runs in its OWN in-container virtualenv (created by the
# OpenHands image plugin) and is reached over loopback HTTP. See plugins/openhands/COMPATIBILITY.md.
# NOTE: no `server` extra. The server-side plugins (ToolsPlugin/RewardsPlugin and the
# IDE server routers) only ever run inside the `idegym-server` container, which is built
# from the workspace and is not published to PyPI. Their runtime deps (fastapi, plus the
# workspace-only idegym-tools / idegym-rewards) are declared by `idegym-server` directly,
# so the published `idegym-plugins` keeps only PyPI-resolvable extras (idea, pycharm).

[project.entry-points."idegym.plugins.image"]
base-system = "idegym.plugins.defaults.image:BaseSystem"
user = "idegym.plugins.defaults.image:User"
permissions = "idegym.plugins.defaults.image:Permissions"
mcp-upstream = "idegym.plugins.defaults.image:MCPUpstream"
project = "idegym.plugins.defaults.image:Project"
idegym-server = "idegym.plugins.defaults.image:IdeGYMServer"
idea = "idegym.plugins.idea.image:Idea"
pycharm = "idegym.plugins.pycharm.image:PyCharm"
openhands = "idegym.plugins.openhands.image:OpenHands"

[project.entry-points."idegym.plugins.server"]
tools = "idegym.plugins.defaults.server:ToolsPlugin"
rewards = "idegym.plugins.defaults.server:RewardsPlugin"
idea = "idegym.plugins.idea.server:IdeaPlugin"
pycharm = "idegym.plugins.pycharm.server:PyCharmPlugin"
openhands = "idegym.plugins.openhands.server:OpenHandsServerPlugin"

[project.entry-points."idegym.plugins.client"]
idea = "idegym.plugins.idea.client:IdeaClientOperations"
pycharm = "idegym.plugins.pycharm.client:PycharmClientOperations"
openhands = "idegym.plugins.openhands.client:OpenHandsClientOperations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single distribution assembled from the per-plugin source trees. All four roots contribute
# to the shared `idegym.plugins.*` PEP 420 namespace.
[tool.hatch.build.targets.wheel]
packages = [
    "defaults/src/idegym",
    "idea/src/idegym",
    "pycharm/src/idegym",
    "openhands/src/idegym",
    "plugin-utils/src/idegym",
]
# Editable installs: expose every per-plugin `src` root on sys.path so the shared
# `idegym.plugins.*` namespace resolves across all four roots. Without this, hatchling's
# default dev-mode setup keeps only one root (they all target `idegym`) and the other
# subpackages become unimportable.
dev-mode-dirs = [
    "defaults/src",
    "idea/src",
    "pycharm/src",
    "openhands/src",
    "plugin-utils/src",
]

# Build-time assets the idea/pycharm plugins COPY into images live outside the `src` trees; ship them
# in the wheel so a plugin author can build images without a checkout of the idegym repo. The shared
# entrypoint (start-ide, check-mcp, supervisord config) lives in plugin-utils; only the prebuilt
# open-project zip is per-IDE. `plugin_asset()` reads them via importlib.resources; the local build
# driver stages them into the Docker build context, and the Kaniko path resolves the same
# `COPY plugins/<name>/...` paths against a git checkout of this repo at the orchestrator version.
# Explicitly include non-Python assets in the sdist so they are present when the wheel is
# built from the sdist (uv build / pip wheel builds wheel from sdist, not from source).
# The wheel force-include paths are resolved relative to the sdist root, so the sdist must
# carry the files at the same relative paths that the wheel config references.
[tool.hatch.build.targets.sdist.force-include]
"plugin-utils/scripts" = "plugin-utils/scripts"
"idea/project-opener/project-opener.zip" = "idea/project-opener/project-opener.zip"
"pycharm/project-opener/project-opener.zip" = "pycharm/project-opener/project-opener.zip"
"openhands/scripts" = "openhands/scripts"

[tool.hatch.build.targets.wheel.force-include]
"plugin-utils/scripts" = "idegym/plugins/plugin_utils/scripts"
"idea/project-opener/project-opener.zip" = "idegym/plugins/idea/project-opener/project-opener.zip"
"pycharm/project-opener/project-opener.zip" = "idegym/plugins/pycharm/project-opener/project-opener.zip"
"openhands/scripts" = "idegym/plugins/openhands/scripts"
