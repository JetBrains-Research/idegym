[program:openhands]
command=/usr/local/bin/start-openhands-service
priority=15
autostart=true
; The service should recover from an unexpected exit without taking down the IdeGYM API
;; a terminal/browser failure must not stop the whole container.
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
redirect_stderr=false
