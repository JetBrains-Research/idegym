deployment:
  image:
    tag: latest
  replicas: 1
  uvicornWorkers: 1
  otel:
    tracing:
      endpoint: http://tempo:4318/v1/traces
  extraEnv:
    - name: IDEGYM_DATABASE_CLEAN
      value: "True"
    - name: KANIKO_INSECURE_REGISTRY
      value: "true"
    - name: DOCKER_REGISTRY
      value: "registry.kube-system.svc.cluster.local"

watcher:
  image:
    tag: latest
  replicas: 1
  otel:
    tracing:
      endpoint: http://tempo:4318/v1/traces
  # Keep the inactivity/finished timeouts at their production defaults (10m/5m) so the watcher does
  # not reap servers/clients that other e2e tests are actively using. Only shorten the cleanup *poll
  # interval* — that controls how often the loop runs, not how stale a record must be before it is
  # cleaned, so it is safe to lower globally. Tests that exercise cleanup (test_watcher.py) create an
  # already-stale record (last_heartbeat_time=0) so they are reaped regardless of the timeouts.
  extraEnv:
    - name: IDEGYM_WATCHER_CLEANUP_INTERVAL
      value: "PT10S"

rbac:
  extraRules:
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

ingress:
  enabled: true
  className: nginx
  host: idegym-local.test
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"

postgresql:
  auth:
    postgresPassword: postgres
    password: idegym

grafana:
  enabled: true

prometheus:
  enabled: true

tempo:
  enabled: true
