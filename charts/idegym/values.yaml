deployment:
  image:
    pullPolicy: IfNotPresent
    repository: ghcr.io/jetbrains-research/idegym/orchestrator
    tag: ""
  imagePullSecrets: [ ]
  extraEnv: [ ]
  database:
    name:
    host:
    port:
    username:
    password:
  log:
    json: true
    level: info
  otel:
    tracing: { }
  replicas: 4
  # MCP session state is stored in-memory per uvicorn worker process. As long as
  # `mcp.statelessHttp` is true every request is independent, so this can be
  # raised freely. If `mcp.statelessHttp` is set to false, this must stay at 1
  # or all session-mode requests need to be pinned to one worker.
  uvicornWorkers: 1
  mcp:
    # Run the FastMCP HTTP app in stateless mode: every request gets a fresh
    # transport, no server-side session state, no Mcp-Session-Id routing. With
    # this on, sticky sessions and single-worker pods are unnecessary. Disable
    # only if you need session-mode features (SSE event resumability) — in
    # which case you must also configure ingress affinity by Mcp-Session-Id
    # (see `ingress.annotations` for an example) and keep `uvicornWorkers: 1`.
    statelessHttp: true
  sqlalchemy:
    pool:
      size: ""
      timeout: ""
      recycle: ""
      prePing: true
    maxOverflow: ""
  resources: { }
  securityContext: { }
  serviceAccount:
    create: true
    name: ""
    annotations: { }
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: jetbrains.com/idegym
                operator: Exists
  tolerations:
    - key: jetbrains.com/idegym
      operator: Exists
      effect: NoSchedule

service:
  type: ClusterIP
  port: 80
  containerPort: 8000

ingress:
  enabled: false
  # Controller-specific annotations passed through verbatim.
  #
  # If you run the orchestrator with `deployment.mcp.statelessHttp: false` and
  # more than one replica/worker, every request within an MCP session MUST land
  # on the same pod — session state lives in-memory per worker process. Without
  # affinity, a request that hops to a different pod gets a "session not found"
  # error and the client has to re-`initialize`.
  #
  # The protocol-level identifier to pin on is the `Mcp-Session-Id` header,
  # which every compliant MCP client echoes back after `initialize`. Below is
  # a full ingress-nginx example; other controllers (Traefik, HAProxy, Gateway
  # API, etc.) expose equivalent primitives — header-based consistent hashing
  # plus long-lived response handling. Consult your controller's docs.
  #
  # annotations:
  #   # Pin a session to a backend pod via consistent hashing on the
  #   # Mcp-Session-Id header. nginx exposes request headers as `$http_<name>`
  #   # with dashes lowercased to underscores. This is header-driven (no cookie
  #   # needed) and works for every MCP client.
  #   nginx.ingress.kubernetes.io/upstream-hash-by: "$http_mcp_session_id"
  #
  #   # Cookie affinity as a belt-and-suspenders fallback for clients that
  #   # preserve cookies (browsers, some SDKs). `affinity-mode: persistent`
  #   # prevents rebalancing when the endpoint set changes (scale events,
  #   # rolling restarts), so existing sessions stay on their pod. The cookie
  #   # is scoped to /mcp because the orchestrator's REST endpoints are
  #   # stateless and don't need affinity.
  #   nginx.ingress.kubernetes.io/affinity: "cookie"
  #   nginx.ingress.kubernetes.io/affinity-mode: "persistent"
  #   nginx.ingress.kubernetes.io/session-cookie-name: "IDEGYM_AFFINITY"
  #   nginx.ingress.kubernetes.io/session-cookie-path: "/mcp"
  #   nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
  #   nginx.ingress.kubernetes.io/session-cookie-expires: "86400"
  #   nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"
  #
  #   # Streamable HTTP can hold long-lived responses (SSE-style). Disable
  #   # response buffering so chunks reach the client immediately, and extend
  #   # proxy timeouts so the ingress doesn't cut a stream short.
  #   nginx.ingress.kubernetes.io/proxy-buffering: "off"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  annotations: { }
  className: ""
  host: ""
  tls:
    enabled: false
    secretName: ""

limitRange:
  enabled: false
  limits: [ ]

resourceQuota:
  enabled: false
  hard: { }

rbac:
  extraRules: [ ]

podSnapshot:
  enabled: false
  serviceAccount:
    create: true
    name: ""
    annotations: { }
  retention:
    lastAccessTimeout: 7d
  snapshotGroupingRules:
    labels:
      - idegym.jetbrains.com/snapshot-id
    maxSnapshotsPerGroup: 5
  storage:
    bucket: idegym
    path: snapshots
    tokenSource: podKSA
  trigger:
    type: manual
    postCheckpoint: resume

postgresql:
  enabled: true
  fullnameOverride: postgres
  auth:
    database: idegym
    username: idegym
  primary:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: jetbrains.com/idegym
                  operator: Exists
    networkPolicy:
      enabled: false
    tolerations:
      - key: jetbrains.com/idegym
        operator: Exists
        effect: NoSchedule

grafana:
  enabled: false
  fullnameOverride: grafana
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m
  sidecar:
    datasources:
      enabled: true
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: jetbrains.com/idegym
                operator: Exists
  tolerations:
    - key: jetbrains.com/idegym
      operator: Exists
      effect: NoSchedule

prometheus:
  enabled: false
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  server:
    fullnameOverride: prometheus
    service:
      servicePort: 9090
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: jetbrains.com/idegym
                  operator: Exists
    tolerations:
      - key: jetbrains.com/idegym
        operator: Exists
        effect: NoSchedule

tempo:
  enabled: false
  fullnameOverride: tempo
  tempo:
    server:
      http_listen_port: 3200
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 512Mi
        cpu: 500m
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: jetbrains.com/idegym
                operator: Exists
  tolerations:
    - key: jetbrains.com/idegym
      operator: Exists
      effect: NoSchedule
