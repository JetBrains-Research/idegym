deployment:
  image:
    pullPolicy: IfNotPresent
    repository: ghcr.io/jetbrains-research/idegym/orchestrator
    tag: ""
  imagePullSecrets: [ ]
  extraEnv: [ ]
  database:
    name:
    host:
    port:
    username:
    password:
  log:
    json: true
    level: info
  otel:
    tracing: { }
  replicas: 4
  uvicornWorkers: 1
  mcp:
    # Force the FastMCP HTTP app to reply with application/json instead of
    # text/event-stream (streamable HTTP / SSE). Some clients (e.g. older Codex
    # builds) do not handle the SSE-style transport correctly; JSON responses
    # are accepted by every compliant MCP client. Set to false to re-enable
    # streaming responses once all target clients are known to support them.
    jsonResponse: true
  sqlalchemy:
    pool:
      size: ""
      timeout: ""
      recycle: ""
      prePing: true
    maxOverflow: ""
  resources: { }
  securityContext: { }
  serviceAccount:
    create: true
    name: ""
    annotations: { }
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: jetbrains.com/idegym
                operator: Exists
  tolerations:
    - key: jetbrains.com/idegym
      operator: Exists
      effect: NoSchedule

service:
  type: ClusterIP
  port: 80
  containerPort: 8000

ingress:
  enabled: false
  annotations:
    # MCP Streamable HTTP stores session state in-memory per uvicorn worker.
    # With replicas > 1 we pin a session to a pod via consistent hashing on the
    # Mcp-Session-Id header — the protocol-level session identifier that every
    # compliant MCP client echoes back after `initialize`. This works regardless
    # of whether the client preserves cookies.
    #
    # This pins a session to a POD, not to a worker process inside the pod, so
    # `deployment.uvicornWorkers` must stay at 1 until MCP session state moves
    # to a shared store (e.g. a Redis-backed event store).
    nginx.ingress.kubernetes.io/upstream-hash-by: "$http_mcp_session_id"
    # Cookie affinity as a belt-and-suspenders fallback for clients that do
    # preserve cookies. Scoped to /mcp because the orchestrator REST endpoints
    # are stateless. `affinity-mode: persistent` prevents rebalancing when the
    # endpoint set changes (scale, rolling restart).
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "IDEGYM_AFFINITY"
    nginx.ingress.kubernetes.io/session-cookie-path: "/mcp"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
    nginx.ingress.kubernetes.io/session-cookie-expires: "86400"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"
    # Streamable HTTP holds long-lived responses; disable response buffering
    # and extend proxy timeouts so streams aren't cut short by the ingress.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  className: ""
  host: ""
  tls:
    enabled: false
    secretName: ""

limitRange:
  enabled: false
  limits: [ ]

resourceQuota:
  enabled: false
  hard: { }

rbac:
  extraRules: [ ]

podSnapshot:
  enabled: false
  serviceAccount:
    create: true
    name: ""
    annotations: { }
  retention:
    lastAccessTimeout: 7d
  snapshotGroupingRules:
    labels:
      - idegym.jetbrains.com/snapshot-id
    maxSnapshotsPerGroup: 5
  storage:
    bucket: idegym
    path: snapshots
    tokenSource: podKSA
  trigger:
    type: manual
    postCheckpoint: resume

postgresql:
  enabled: true
  fullnameOverride: postgres
  auth:
    database: idegym
    username: idegym
  primary:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: jetbrains.com/idegym
                  operator: Exists
    networkPolicy:
      enabled: false
    tolerations:
      - key: jetbrains.com/idegym
        operator: Exists
        effect: NoSchedule

grafana:
  enabled: false
  fullnameOverride: grafana
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m
  sidecar:
    datasources:
      enabled: true
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: jetbrains.com/idegym
                operator: Exists
  tolerations:
    - key: jetbrains.com/idegym
      operator: Exists
      effect: NoSchedule

prometheus:
  enabled: false
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  server:
    fullnameOverride: prometheus
    service:
      servicePort: 9090
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: jetbrains.com/idegym
                  operator: Exists
    tolerations:
      - key: jetbrains.com/idegym
        operator: Exists
        effect: NoSchedule

tempo:
  enabled: false
  fullnameOverride: tempo
  tempo:
    server:
      http_listen_port: 3200
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 512Mi
        cpu: 500m
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: jetbrains.com/idegym
                operator: Exists
  tolerations:
    - key: jetbrains.com/idegym
      operator: Exists
      effect: NoSchedule
