deployment:
  image:
    pullPolicy: IfNotPresent
    repository: ghcr.io/jetbrains-research/idegym/orchestrator
    tag: ""
  imagePullSecrets: [ ]
  extraEnv: [ ]
  log:
    json: true
    level: info
  otel:
    tracing: { }
  replicas: 4
  # Safe to raise when mcp.statelessHttp is true. With session mode
  # (statelessHttp: false) this must stay at 1.
  uvicornWorkers: 1
  mcp:
    # Stateless mode: each request gets a fresh transport, no server-side session
    # state. Set false only for session-mode features (SSE resumability); you then
    # must keep uvicornWorkers at 1 and pin ingress affinity. See "MCP Sessions and
    # Ingress Affinity" in website/docs/reference/remote_deployment.md.
    statelessHttp: true
  sqlalchemy:
    pool:
      size: ""
      timeout: ""
      recycle: ""
      prePing: true
    maxOverflow: ""
  resources: { }
  securityContext: { }
  serviceAccount:
    create: true
    name: ""
    annotations: { }
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: jetbrains.com/idegym
                operator: Exists
  tolerations:
    - key: jetbrains.com/idegym
      operator: Exists
      effect: NoSchedule

# The watcher is a dedicated single-replica service that runs the periodic cleanup loop
# (inactive servers/clients, stale requests, orphaned Kaniko jobs). Extracting it from the
# orchestrator lets the orchestrator scale freely. It reuses the shared database
# (database / postgresql) and RBAC Role.
watcher:
  enabled: true
  image:
    pullPolicy: IfNotPresent
    repository: ghcr.io/jetbrains-research/idegym/watcher
    tag: ""
  # The cleanup loop guards itself with a Postgres advisory lock, so a single replica is enough.
  replicas: 1
  extraEnv: [ ]
  log:
    json: true
    level: info
  otel:
    tracing: { }
  sqlalchemy:
    pool:
      size: ""
      timeout: ""
      recycle: ""
      prePing: true
    maxOverflow: ""
  resources: { }
  securityContext: { }
  serviceAccount:
    create: true
    name: ""
    annotations: { }
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: jetbrains.com/idegym
                operator: Exists
  tolerations:
    - key: jetbrains.com/idegym
      operator: Exists
      effect: NoSchedule

# Connection settings for the database shared by the orchestrator and watcher.
# Unset fields fall back to the bundled postgresql subchart; override them to point
# at an external database (each field accepts a literal value or a secret reference).
database:
  name:
  host:
  port:
  username:
  password:
  # The exact Alembic revision this release's images migrate to, so a change that adds a
  # migration must bump it too. The orchestrator refuses to start on a mismatch, and
  # `scripts/rollback.py` reads it back from the target release to pick the downgrade
  # target. See website/docs/reference/database_rollback.md.
  schemaRevision: "003"

service:
  type: ClusterIP
  port: 80
  containerPort: 8000

ingress:
  enabled: false
  # Controller-specific annotations passed through verbatim. For session-mode MCP
  # (deployment.mcp.statelessHttp: false) you must pin ingress affinity on the
  # Mcp-Session-Id header; see "MCP Sessions and Ingress Affinity" in
  # website/docs/reference/remote_deployment.md for a full ingress-nginx example.
  annotations: { }
  className: ""
  host: ""
  tls:
    enabled: false
    secretName: ""

limitRange:
  enabled: false
  limits: [ ]

resourceQuota:
  enabled: false
  hard: { }

rbac:
  extraRules: [ ]

podSnapshot:
  enabled: false
  serviceAccount:
    create: true
    name: ""
    annotations: { }
  # The keys below mirror the GKE PodSnapshotPolicy / PodSnapshotStorageConfig CRD spec verbatim;
  # see https://docs.cloud.google.com/kubernetes-engine/docs/concepts/pod-snapshots for the full field reference.
  snapshotStorageConfig:
    gcs:
      bucket: ""
      path: ""
      tokenSource: ""
  retentionConfig:
    lastAccessTimeout: 7d
  snapshotGroupingRules:
    groupByLabelValue:
      groupRetentionPolicy:
        maxSnapshotCountPerGroup: 5

postgresql:
  enabled: true
  fullnameOverride: postgres
  auth:
    database: idegym
    username: idegym
  primary:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: jetbrains.com/idegym
                  operator: Exists
    networkPolicy:
      enabled: false
    tolerations:
      - key: jetbrains.com/idegym
        operator: Exists
        effect: NoSchedule

grafana:
  enabled: false
  fullnameOverride: grafana
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m
  sidecar:
    datasources:
      enabled: true
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: jetbrains.com/idegym
                operator: Exists
  tolerations:
    - key: jetbrains.com/idegym
      operator: Exists
      effect: NoSchedule

prometheus:
  enabled: false
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  server:
    fullnameOverride: prometheus
    service:
      servicePort: 9090
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: jetbrains.com/idegym
                  operator: Exists
    tolerations:
      - key: jetbrains.com/idegym
        operator: Exists
        effect: NoSchedule

tempo:
  enabled: false
  fullnameOverride: tempo
  tempo:
    server:
      http_listen_port: 3200
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 512Mi
        cpu: 500m
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: jetbrains.com/idegym
                operator: Exists
  tolerations:
    - key: jetbrains.com/idegym
      operator: Exists
      effect: NoSchedule
