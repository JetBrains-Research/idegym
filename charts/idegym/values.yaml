deployment:
  image:
    pullPolicy: IfNotPresent
    repository: ghcr.io/jetbrains-research/idegym/orchestrator
    tag: ""
  imagePullSecrets: [ ]
  extraEnv: [ ]
  database:
    name:
    host:
    port:
    username:
    password:
  log:
    json: true
    level: info
  otel:
    tracing: { }
  replicas: 4
  # MCP session state is stored in-memory per uvicorn worker process. As long as
  # `mcp.statelessHttp` is true every request is independent, so this can be
  # raised freely. If `mcp.statelessHttp` is set to false, this must stay at 1
  # or all session-mode requests need to be pinned to one worker.
  uvicornWorkers: 1
  mcp:
    # Force the FastMCP HTTP app to reply with application/json instead of
    # text/event-stream (streamable HTTP / SSE). Some clients (e.g. older Codex
    # builds) do not handle the SSE-style transport correctly; JSON responses
    # are accepted by every compliant MCP client. Set to false to re-enable
    # streaming responses once all target clients are known to support them.
    jsonResponse: true
    # Run the FastMCP HTTP app in stateless mode: every request gets a fresh
    # transport, no server-side session state, no Mcp-Session-Id routing. With
    # this on, sticky sessions and single-worker pods are unnecessary. Disable
    # only if you need session-mode features (SSE event resumability) — then
    # also set `mcp.stickySessions: true` and keep `uvicornWorkers: 1`.
    statelessHttp: true
    # Add nginx ingress annotations that pin MCP sessions to a pod via
    # consistent hashing on the Mcp-Session-Id header (with a cookie-affinity
    # fallback). Only needed when `mcp.statelessHttp` is false. Has no effect
    # unless `ingress.enabled` is also true.
    stickySessions: false
  sqlalchemy:
    pool:
      size: ""
      timeout: ""
      recycle: ""
      prePing: true
    maxOverflow: ""
  resources: { }
  securityContext: { }
  serviceAccount:
    create: true
    name: ""
    annotations: { }
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: jetbrains.com/idegym
                operator: Exists
  tolerations:
    - key: jetbrains.com/idegym
      operator: Exists
      effect: NoSchedule

service:
  type: ClusterIP
  port: 80
  containerPort: 8000

ingress:
  enabled: false
  # Extra ingress annotations. MCP sticky-session annotations are injected
  # automatically by the template when `deployment.mcp.stickySessions` is true.
  annotations: { }
  className: ""
  host: ""
  tls:
    enabled: false
    secretName: ""

limitRange:
  enabled: false
  limits: [ ]

resourceQuota:
  enabled: false
  hard: { }

rbac:
  extraRules: [ ]

podSnapshot:
  enabled: false
  serviceAccount:
    create: true
    name: ""
    annotations: { }
  retention:
    lastAccessTimeout: 7d
  snapshotGroupingRules:
    labels:
      - idegym.jetbrains.com/snapshot-id
    maxSnapshotsPerGroup: 5
  storage:
    bucket: idegym
    path: snapshots
    tokenSource: podKSA
  trigger:
    type: manual
    postCheckpoint: resume

postgresql:
  enabled: true
  fullnameOverride: postgres
  auth:
    database: idegym
    username: idegym
  primary:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: jetbrains.com/idegym
                  operator: Exists
    networkPolicy:
      enabled: false
    tolerations:
      - key: jetbrains.com/idegym
        operator: Exists
        effect: NoSchedule

grafana:
  enabled: false
  fullnameOverride: grafana
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m
  sidecar:
    datasources:
      enabled: true
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: jetbrains.com/idegym
                operator: Exists
  tolerations:
    - key: jetbrains.com/idegym
      operator: Exists
      effect: NoSchedule

prometheus:
  enabled: false
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  server:
    fullnameOverride: prometheus
    service:
      servicePort: 9090
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: jetbrains.com/idegym
                  operator: Exists
    tolerations:
      - key: jetbrains.com/idegym
        operator: Exists
        effect: NoSchedule

tempo:
  enabled: false
  fullnameOverride: tempo
  tempo:
    server:
      http_listen_port: 3200
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 512Mi
        cpu: 500m
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: jetbrains.com/idegym
                operator: Exists
  tolerations:
    - key: jetbrains.com/idegym
      operator: Exists
      effect: NoSchedule
