{{- if .Values.deployment.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "idegym.deployment.serviceAccountName" . }}
  labels:
    {{- include "idegym.labels" . | nindent 4 }}
  {{- with .Values.deployment.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.podSnapshot.enabled .Values.podSnapshot.serviceAccount.create (.Capabilities.APIVersions.Has "podsnapshot.gke.io/v1") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "idegym.podSnapshot.serviceAccountName" . }}
  labels:
    {{- include "idegym.labels" . | nindent 4 }}
  {{- with .Values.podSnapshot.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
