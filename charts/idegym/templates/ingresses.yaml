{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "idegym.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idegym.labels" . | nindent 4 }}
  {{- $annotations := .Values.ingress.annotations | default dict }}
  {{- if .Values.deployment.mcp.stickySessions }}
  {{- $stickyAnnotations := dict
    "nginx.ingress.kubernetes.io/upstream-hash-by" "$http_mcp_session_id"
    "nginx.ingress.kubernetes.io/affinity" "cookie"
    "nginx.ingress.kubernetes.io/affinity-mode" "persistent"
    "nginx.ingress.kubernetes.io/session-cookie-name" "IDEGYM_AFFINITY"
    "nginx.ingress.kubernetes.io/session-cookie-path" "/mcp"
    "nginx.ingress.kubernetes.io/session-cookie-samesite" "Lax"
    "nginx.ingress.kubernetes.io/session-cookie-expires" "86400"
    "nginx.ingress.kubernetes.io/session-cookie-max-age" "86400"
    "nginx.ingress.kubernetes.io/proxy-buffering" "off"
    "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600"
    "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600"
  }}
  {{- $annotations = merge $annotations $stickyAnnotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "idegym.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "idegym.fullname" $ }}
                port:
                  name: http
{{- end }}
