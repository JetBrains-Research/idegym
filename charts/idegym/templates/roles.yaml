apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "idegym.fullname" . }}
  labels:
    {{- include "idegym.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Read-only: the readiness wait reads the autoscaler's events on a pending pod to tell a node
  # that is still booting from one that will never arrive. Without this the wait still works, it
  # just cannot make that distinction.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Read-only, for the dashboard: container logs, and the ReplicaSets whose events explain a
  # server pod that was never created (a ResourceQuota or LimitRange refusing it).
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  {{- if and .Values.podSnapshot.enabled (.Capabilities.APIVersions.Has "podsnapshot.gke.io/v1") }}
  - apiGroups: ["podsnapshot.gke.io"]
    resources: ["podsnapshotmanualtriggers", "podsnapshots"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  {{- end }}
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- if .Values.dashboard.shell.enabled }}
---
# The dashboard's pod shell, in a Role of its own so that only the orchestrator (not the watcher,
# which shares the Role above) may exec. Exec runs over a WebSocket, which the API server authorizes
# as get on older clusters and as create on newer ones, so both verbs are needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "idegym.fullname" . }}-shell
  labels:
    {{- include "idegym.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
{{- end }}
