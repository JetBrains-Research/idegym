{{- if and .Values.podSnapshot.enabled (.Capabilities.APIVersions.Has "podsnapshot.gke.io/v1") }}
apiVersion: podsnapshot.gke.io/v1
kind: PodSnapshotPolicy
metadata:
  name: {{ include "idegym.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idegym.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: idegym
      app.kubernetes.io/component: sandbox
  storageConfigName: {{ include "idegym.name" . }}
  triggerConfig:
    type: manual
    postCheckpoint: resume
  {{- with .Values.podSnapshot.retentionConfig }}
  retentionConfig:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.podSnapshot.snapshotGroupingRules }}
  snapshotGroupingRules:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
