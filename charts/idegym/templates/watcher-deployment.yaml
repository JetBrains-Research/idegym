{{- if .Values.watcher.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "idegym.watcher.fullname" . }}
  labels:
    {{- include "idegym.watcher.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.watcher.replicas }}
  selector:
    matchLabels:
      {{- include "idegym.watcher.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "idegym.watcher.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "{{ .Values.service.containerPort }}"
    spec:
      serviceAccountName: {{ include "idegym.watcher.serviceAccountName" . }}
      {{- with .Values.deployment.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.watcher.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: watcher
          image: "{{ .Values.watcher.image.repository }}:{{ .Values.watcher.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.watcher.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          env:
            - name: __POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.uid"
            - name: __POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.name"
            - name: __NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.namespace"
            - name: __NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: "spec.nodeName"
            {{- with .Values.watcher.log }}
            - name: IDEGYM_LOG_LEVEL
              value: {{ quote .level | upper }}
            - name: IDEGYM_LOG_JSON_FORMAT
              value: {{ quote .json | title }}
            {{- end }}
            - name: IDEGYM_ORCHESTRATOR_PORT
              value: {{ .Values.service.containerPort | quote }}
            - name: IDEGYM_OTEL_ATTRIBUTES
              value: |-
                { k8s.pod.uid: "$(__POD_UID)", k8s.pod.name: "$(__POD_NAME)", k8s.namespace.name: "$(__NAMESPACE)", k8s.node.name: "$(__NODE_NAME)" }
            - name: IDEGYM_OTEL_SERVICE_NAME
              value: {{ include "idegym.watcher.fullname" . | quote }}
            {{- with .Values.watcher.otel.tracing }}
            - name: IDEGYM_OTEL_TRACING_ENDPOINT
              value: {{ .endpoint | quote }}
            - name: IDEGYM_OTEL_TRACING_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: "tracing"
                  key: "username"
                  optional: true
            - name: IDEGYM_OTEL_TRACING_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "tracing"
                  key: "password"
                  optional: true
            {{- end }}
            {{- with .Values.watcher.sqlalchemy.pool }}
            {{- if .size }}
            - name: IDEGYM_SQLALCHEMY_POOL_SIZE
              value: {{ .size | quote }}
            {{- end }}
            {{- if .timeout }}
            - name: IDEGYM_SQLALCHEMY_POOL_TIMEOUT
              value: {{ .timeout | quote }}
            {{- end }}
            {{- if .recycle }}
            - name: IDEGYM_SQLALCHEMY_POOL_RECYCLE
              value: {{ .recycle | quote }}
            {{- end }}
            - name: IDEGYM_SQLALCHEMY_POOL_PRE_PING
              value: {{ quote .prePing | title }}
            {{- end }}
            {{- if .Values.watcher.sqlalchemy.maxOverflow }}
            - name: IDEGYM_SQLALCHEMY_MAX_OVERFLOW
              value: {{ .Values.watcher.sqlalchemy.maxOverflow | quote }}
            {{- end }}
            - name: IDEGYM_NODE_POOL_ENABLED
              value: "True"
            - name: IDEGYM_NODE_POOL_TAINT_KEY
              value: "jetbrains.com/idegym"
            - name: IDEGYM_NODE_POOL_PREFERENCE_WEIGHT
              value: "100"
            {{- include "idegym.databaseEnv" . | nindent 12 }}
            {{- with .Values.watcher.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.watcher.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 60
      {{- with .Values.watcher.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.watcher.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
