# Image definitions exercising the inline-Dockerfile-base features on the cloudbuild_gke backend.
#
# These are the capabilities that cannot be covered anywhere else: Kaniko rejects BuildKit-only
# syntax by design, and the Minikube e2e environment has no object storage for a build context.
#
# Every image asserts its own expectations with `test` inside the build, so an unresolved COPY or a
# missing ENV fails the build instead of quietly producing a wrong image.
#
# `__CONTEXT_URI__` is filled in by scripts/cloudbuild_gke_prepare_context.py -- see the header of
# that script for the two-command workflow.

images:
  # 1. Baseline. A multi-stage inline base, with a COPY --from between the author's own stages and
  #    an ENV the generated idegym stage must inherit through FROM <alias>.
  - name: smoke-inline-plain
    base_dockerfile: |
      FROM debian:bookworm-slim AS toolchain
      RUN mkdir -p /artifacts && printf '%s\n' 'built-in-an-earlier-stage' > /artifacts/marker.txt

      FROM debian:bookworm-slim
      COPY --from=toolchain /artifacts/marker.txt /opt/inline-base-marker.txt
      ENV INLINE_BASE_ENV=inline-base-was-here
    commands:
      - test "$(cat /opt/inline-base-marker.txt)" = "built-in-an-earlier-stage"
      - test "$INLINE_BASE_ENV" = "inline-base-was-here"

  # 2. A heredoc base. Cloud Build's built-in Dockerfile frontend cannot parse this, so it only
  #    builds if BUILDKIT_SYNTAX was injected. The same definition is rejected up front on Kaniko.
  - name: smoke-inline-heredoc
    base_dockerfile: |
      FROM debian:bookworm-slim
      RUN <<EOF
      mkdir -p /opt/hd
      echo heredoc-worked > /opt/hd/out.txt
      EOF
    commands:
      - test "$(cat /opt/hd/out.txt)" = "heredoc-worked"

  # 3. A caller-staged build context. The archive is overlaid into /workspace by a fetch step that
  #    runs before the docker build. The archive also contains a decoy `Dockerfile` that fails the
  #    build on purpose, so a clobbered overlay shows up as a failed build rather than as a valid
  #    but empty image that passes every check below.
  - name: smoke-inline-context
    context_uri: __CONTEXT_URI__
    base_dockerfile: |
      FROM debian:bookworm-slim
      COPY caller-asset.txt /opt/caller-asset.txt
      COPY nested/deeper-asset.txt /opt/deeper-asset.txt
    commands:
      - test "$(cat /opt/caller-asset.txt)" = "from-the-caller-context"
      - test "$(cat /opt/deeper-asset.txt)" = "nested-caller-asset"
