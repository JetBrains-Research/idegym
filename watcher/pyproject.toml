[project]
name = "idegym-watcher"
version = "0.0.0.dev0"
description = "IdeGYM Watcher"
authors = [
    { name = "Daniil Mironov", email = "daniil.mironov@jetbrains.com" },
    { name = "Ozren Dabić", email = "ozren.dabic@jetbrains.com" },
    { name = "Valentin Fondaratov", email = "valentin.fondaratov@jetbrains.com" },
    { name = "Vladimir Poliakov", email = "vladimir.poliakov@jetbrains.com" },
    { name = "Vseslav Kasatskii", email = "vseslav.kasatskii@jetbrains.com" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "idegym-api",
    "idegym-backend-utils",
    "idegym-common-utils",
    "idegym-orchestrator",
    "pydantic>=2.10.6",
    "uvicorn>=0.50.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idegym"]
